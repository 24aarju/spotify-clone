<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>'Spotify -Web player:Music for everyone</title>
</head>

<body>
    <div class="container flex bg-black">
        <div class="left">
            <div class="close">
                <img width="30" class="invert" src="close.svg" alt="">
            </div>
            <div class="home bg-grey rounded m-1 p-1">
                <div class="logo"><img src="logo2.svg" alt="spotify"> Spotify</div>
                <ul>
                    <li><img class="invert" src="home.svg" alt="home">Home</li>
                    <li><img class="invert" src="search.svg" alt="home">Search</li>
                </ul>
            </div>
            <div class="library bg-grey rounded m-1 p-1 bold">
                Your Library
                <div class="librarymenu">
                    <ul>
                        <li>Playlist</li>
                        <li>Artist</li>
                        <li>Album</li>
                    </ul>
                </div>
                <div class="songlist">
                    <h3>Song List</h3>
                    <ul>

                    </ul>
                </div>

                <div class="footer">

                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>

                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>

                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
                    </div>

                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>

                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>

                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>

                </div>
            </div>
        </div>
        <div class="right bg-grey rounded ">
            <div class="header">
                <div class="nav">
                    <div class="hamburgercont">
                        <img width="40" class="invert hamburger" src="hamburger.svg" alt="">
                        <i class="fa-solid fa-angle-left"></i>
                        <i class="fa-solid fa-angle-right"></i>
                    </div>
                </div>
                <div class="button">
                    <button class="signupbtn">Sign up</button>
                    <button class="loginbtn">log in</button>
                </div>
            </div>

            <div class="SpotifyPlaylist">
                <h1>Spotify Playlist</h1>

                <div class="cardContainer">

                </div>

                <div class="playbar">
                    <div class="seekbar">
                        <div class="circle">
                        </div>
                    </div>
                    <div class="abovbar">
                        <div class="songinfo">

                        </div>
                        <div class="songbuttons">

                            <img width="40" class="invert" id="previous" src="previous.svg" alt="">

                            <img width="40" class="invert" id="play" src="play.svg" alt="">

                            <img width="40" class="invert" id="next" src="next.svg" alt="">

                        </div>

                        <div class="songtime"></div>

                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
